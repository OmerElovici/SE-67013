<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTT · Discord to Text</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <main class="app-container">
    <header class="header">
      <div class="header-title">
        <h1>DTT</h1>
        <p>Discord conversations, transcribed locally</p>
      </div>
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Bot Starting…</span>
      </div>
    </header>

    <section class="connection-panel" aria-label="Discord connection">
      <div class="field">
        <label for="channelSelect">Discord voice channel</label>
        <div class="select-row">
          <select id="channelSelect" disabled>
            <option value="">Waiting for Discord bot…</option>
          </select>
          <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh channels" title="Refresh channels" disabled>
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v6h6M20 20v-6h-6M5.6 15A7 7 0 0018 17.4M18.4 9A7 7 0 006 6.6"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="errorMessage" class="error-message" role="alert" hidden></div>
    </section>

    <section class="visualizer-container" aria-label="Incoming Discord audio level">
      <canvas id="visualizer" class="visualizer-canvas"></canvas>
    </section>

    <section id="activeSpeakers" class="active-speakers" aria-live="polite"></section>

    <section class="controls">
      <button id="toggleBtn" class="btn btn-primary" disabled>
        <svg id="toggleIcon" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
        </svg>
        <span id="toggleText">Connect Bot</span>
      </button>
      <button id="clearBtn" class="btn btn-secondary">Clear Output</button>
    </section>

    <section id="transcriptionPanel" class="transcription-panel" aria-live="polite">
      <div id="emptyState" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
        <div>
          <p class="empty-title">No transcription yet</p>
          <p id="emptyCopy" class="empty-copy">Connect the bot to a voice channel to begin.</p>
        </div>
      </div>
      <div id="transcriptList" class="transcript-list"></div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
