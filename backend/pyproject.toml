[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for real-time Whisper CPU transcription"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "websockets>=11.0",
    "numpy>=1.20.0,<2.0.0",
    "pywhispercpp>=0.0.10",
    "discord.py[voice]>=2.7.1,<2.8",
    "discord-ext-voice-recv>=0.5.2a179,<0.6",
    "soxr>=0.5.0,<2.0"
]
requires-python = ">=3.12"
readme = "README.md"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
